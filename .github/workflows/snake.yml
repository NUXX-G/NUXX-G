name: Generate Snake
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: NUXX-G
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=7aaac8&color_dots=#0d1117,#1a3a4a,#1e5a6e,#267a94,#7aaac8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=7aaac8&color_dots=#0d1117,#1a3a4a,#1e5a6e,#267a94,#7aaac8
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
